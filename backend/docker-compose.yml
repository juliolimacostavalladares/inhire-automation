services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: inhire
      POSTGRES_PASSWORD: inhire
      POSTGRES_DB: inhire
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inhire"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    env_file: ${ENV_FILE:-.env}
    ports:
      - "3000:3000"
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    command: ["node", "dist/main.js"]

  worker:
    build: .
    env_file: ${ENV_FILE:-.env}
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    command: ["node", "dist/worker.js"]

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.migrate
    restart: on-failure
    env_file: ${ENV_FILE:-.env}
    depends_on:
      postgres: { condition: service_healthy }

volumes:
  postgres_data:
  redis_data:
